apiVersion: mesh.sjcloud.io/v1alpha1
kind: Service
schemaVersion: 1
metadata:
  name: api-gateway
spec:
  service:
    id: api-gateway
    name: API Gateway Service
    version: 1.0.0
    protocol: http
    visibility: public
    network: sj-proxy
    owner: platform-routing
    environment: development
    dependencies:
      - redis
    trust_level: low
    resource_class: standard
    runtime_class: nodejs
    capabilities:
      - read:api-gateway
      - write:api-gateway
    labels:
      app: api-gateway
      tier: backend
  routing:
    internal_dns: http://api-gateway
    container_name: sj-api-gateway
  security:
    tls_required: true
  timeouts:
    connect_ms: 2000
    read_ms: 15000
    write_ms: 15000
    request_ms: 30000
  retry:
    type: exponential_jitter
    max_attempts: 3
    base_delay_ms: 100
    max_delay_ms: 2000
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_ms: 10000
    half_open_max_requests: 2
  load_balancer:
    strategy: round_robin
  telemetry:
    health_endpoint: /health
    ready_endpoint: /ready
    metrics_endpoint: /metrics
  kubernetes:
    service_name: api-gateway
    namespace: sj-proxy
    port: 80
