$schema: "http://json-schema.org/draft-07/schema#"
title: "TenantConfigSchema"
type: "object"
required:
  - "tenant_id"
  - "slug"
  - "display_name"
  - "status"
  - "primary_domain"
  - "environment"
properties:
  tenant_id:
    type: "string"
    pattern: "^[a-z0-9-]+$"
  slug:
    type: "string"
    pattern: "^[a-z0-9-]+$"
  display_name:
    type: "string"
  status:
    type: "string"
    enum: [
      "CREATING", "PROVISIONING", "STARTING", "ACTIVE", "SUSPENDED",
      "UPDATING", "MIGRATING", "RESTORING", "ARCHIVED", "FAILED",
      "DELETING", "DELETED"
    ]
  plan:
    type: "string"
  primary_domain:
    type: "string"
  custom_domains:
    type: "array"
    items:
      type: "string"
  environment:
    type: "string"
  region:
    type: "string"
  runtime:
    type: "object"
    properties:
      runtime_class:
        type: "string"
      cpu:
        type: "string"
      memory:
        type: "string"
      storage:
        type: "string"
  database:
    type: "object"
    properties:
      name:
        type: "string"
      host:
        type: "string"
      port:
        type: "integer"
      username:
        type: "string"
      password:
        type: "string"
  storage_bucket:
    type: "string"
  features:
    type: "array"
    items:
      type: "string"
  policies:
    type: "object"
    properties:
      resource_limits:
        type: "object"
        properties:
          cpu:
            type: "string"
          memory:
            type: "string"
          storage:
            type: "string"
          bandwidth:
            type: "string"
      allowed_domains:
        type: "array"
        items:
          type: "string"
      runtime_class:
        type: "string"
      network_policy:
        type: "string"
      backup_schedule:
        type: "string"
      retention_policy:
        type: "object"
        properties:
          days:
            type: "integer"
