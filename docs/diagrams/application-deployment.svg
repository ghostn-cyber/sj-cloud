<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#fafafa" rx="10"/>
  <text x="400" y="40" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Application Deployment Strategies</text>

  <!-- Boxes -->
  <rect x="290" y="80" width="220" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="400" y="115" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">Deployment Triggered</text>

  <rect x="290" y="200" width="220" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="400" y="235" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">Strategy Dispatcher</text>

  <rect x="140" y="320" width="220" height="60" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="250" y="355" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">Rolling Strategy (Start-Verify-Stop)</text>

  <rect x="440" y="320" width="220" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="550" y="355" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">Recreate Strategy (Stop-then-Start)</text>

  <!-- Arrows -->
  <path d="M 400,140 L 400,200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400,260 L 250,320" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400,260 L 550,320" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
</svg>
