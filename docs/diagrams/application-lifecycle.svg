<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#fafafa" rx="10"/>
  <text x="400" y="40" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Application Lifecycle FSM States</text>

  <!-- Boxes -->
  <rect x="290" y="80" width="220" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="400" y="115" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">CREATED</text>

  <rect x="290" y="180" width="220" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="400" y="215" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">BUILDING</text>

  <rect x="290" y="280" width="220" height="60" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="400" y="315" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">DEPLOYING</text>

  <rect x="180" y="400" width="200" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/>
  <text x="280" y="435" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">ACTIVE</text>

  <rect x="420" y="400" width="200" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="520" y="435" font-family="'Outfit', sans-serif" font-size="14" fill="#333" text-anchor="middle">ROLLBACK</text>

  <!-- Arrows -->
  <path d="M 400,140 L 400,180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400,240 L 400,280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 400,340 L 280,400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380,430 L 420,430" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
</svg>
