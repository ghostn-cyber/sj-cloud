global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 5m
  receiver: 'mock-receiver'

receivers:
  - name: 'mock-receiver'
    webhook_configs:
      - url: 'http://sj-alertmanager:9093/webhook' # Internal mock receiver endpoint
        send_resolved: true
