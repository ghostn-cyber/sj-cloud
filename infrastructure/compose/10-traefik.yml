services:
  docker-socket-proxy:
    build:
      context: ../../services/docker-api-proxy
    container_name: sj-docker-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik:/etc/traefik
    labels:
      platform: "sj-cloud"
      layer: "ingress-proxy"
      environment: "local"
      managed-by: "docker-compose"
      description: "Docker API version translation proxy for Traefik."

  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.1}
    container_name: sj-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=${TRAEFIK_DASHBOARD:-true}"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    depends_on:
      - docker-socket-proxy
    security_opt:
      - no-new-privileges:true
    read_only: false
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    networks:
      sj-edge:
      sj-proxy:
    volumes:
      - ../traefik:/etc/traefik
    environment:
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL:-INFO}
      - TRAEFIK_DASHBOARD=${TRAEFIK_DASHBOARD:-true}
      - TRAEFIK_PING=${TRAEFIK_PING:-true}
    labels:
      platform: "sj-cloud"
      layer: "ingress"
      environment: "local"
      managed-by: "docker-compose"
      description: "Official reverse proxy and ingress gateway for SJ Cloud."

networks:
  sj-edge:
    external: true
  sj-proxy:
    external: true
