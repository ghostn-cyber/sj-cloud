services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: sj-prometheus
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sj-prometheus-data:/prometheus
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerting/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    networks:
      - sj-monitoring
      - sj-proxy
    deploy:
      resources:
        limits:
          pids: 100
          cpus: '0.6'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: sj-grafana
    restart: unless-stopped
    init: true
    read_only: true
    user: "472:472"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sj-grafana-data:/var/lib/grafana
      - ../provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    secrets:
      - grafana_admin_password
    networks:
      - sj-monitoring
      - sj-proxy
    deploy:
      resources:
        limits:
          pids: 100
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sj-alertmanager
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /alertmanager
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - sj-monitoring
    deploy:
      resources:
        limits:
          pids: 50
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: sj-node-exporter
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - sj-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9100/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sj-cadvisor
    restart: unless-stopped
    privileged: true
    read_only: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - sj-monitoring
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 200M
        reservations:
          cpus: '0.05'
          memory: 50M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: sj-blackbox-exporter
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - sj-monitoring
      - sj-proxy
    deploy:
      resources:
        limits:
          pids: 50
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9115/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  sj-proxy:
    external: true
  sj-monitoring:
    external: true

volumes:
  sj-prometheus-data:
    name: sj-prometheus-data
  sj-grafana-data:
    name: sj-grafana-data

secrets:
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
