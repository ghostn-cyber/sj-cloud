  mock-tenant-manager:
    build:
      context: ../..
      dockerfile: platform/dashboard/Dockerfile
    container_name: sj-tenant-manager
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../../config:/app/config:ro
      - ../../tenants:/app/tenants:ro
    environment:
      - SERVICE_ID=tenant-manager
      - PORT=80
    networks:
      - sj-services
      - sj-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-controlplane.entrypoints=websecure"
      - "traefik.http.routers.dashboard-controlplane.rule=Host(`dashboard.sj-cloud.test`) || Host(`dashboard.platform.test`)"
      - "traefik.http.routers.dashboard-controlplane.tls=true"
      - "traefik.http.services.dashboard-controlplane.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          pids: 50
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
