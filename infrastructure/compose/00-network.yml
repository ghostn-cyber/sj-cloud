
networks:
  sj-edge:
    name: sj-edge
    driver: bridge
    attachable: true
    internal: false
    labels:
      platform: "sj-cloud"
      layer: "network"
      environment: "local"
      managed-by: "docker-compose"
      description: "External entry network. Receives traffic from host and connects only to Traefik proxy. Publishes ports 80 and 443."
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24

  sj-proxy:
    name: sj-proxy
    driver: bridge
    attachable: true
    internal: true
    labels:
      platform: "sj-cloud"
      layer: "network"
      environment: "local"
      managed-by: "docker-compose"
      description: "Reverse proxy routing network connecting Traefik, API Gateway, Dashboard, Docs, and Status. No databases or storage."
    ipam:
      driver: default
      config:
        - subnet: 172.20.1.0/24

  sj-services:
    name: sj-services
    driver: bridge
    attachable: true
    internal: true
    labels:
      platform: "sj-cloud"
      layer: "network"
      environment: "local"
      managed-by: "docker-compose"
      description: "Internal service network for Auth, Notifications, Queue, Search, Analytics, Audit, Storage API, and Tenant Applications."
    ipam:
      driver: default
      config:
        - subnet: 172.20.2.0/24

  sj-data:
    name: sj-data
    driver: bridge
    attachable: true
    internal: true
    labels:
      platform: "sj-cloud"
      layer: "network"
      environment: "local"
      managed-by: "docker-compose"
      description: "Private database and storage network for PostgreSQL, Redis, and MinIO. No public access or published ports."
    ipam:
      driver: default
      config:
        - subnet: 172.20.3.0/24

  sj-monitoring:
    name: sj-monitoring
    driver: bridge
    attachable: true
    internal: true
    labels:
      platform: "sj-cloud"
      layer: "network"
      environment: "local"
      managed-by: "docker-compose"
      description: "Observability network connecting Prometheus, Grafana, Loki, and AlertManager for metrics/log scraping."
    ipam:
      driver: default
      config:
        - subnet: 172.20.4.0/24

  sj-backup:
    name: sj-backup
    driver: bridge
    attachable: true
    internal: true
    labels:
      platform: "sj-cloud"
      layer: "network"
      environment: "local"
      managed-by: "docker-compose"
      description: "Isolated database and storage backup and restore network. No application or request traffic."
    ipam:
      driver: default
      config:
        - subnet: 172.20.5.0/24
