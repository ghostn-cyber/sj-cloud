services:
  mesh-proxy:
    build:
      context: ../..
      dockerfile: platform/service-mesh/proxy/Dockerfile
    container_name: sj-mesh-proxy
    command: node proxy/server.js
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../../config:/app/config
    ports:
      - "9090:9090"
    environment:
      - PORT=80
      - ADMIN_PORT=9090
      - NODE_ENV=development
    depends_on:
      registry-api:
        condition: service_healthy
    networks:
      sj-services:
        aliases:
          - auth
          - storage
          - notification
          - analytics
          - audit
          - search
          - queue
          - api-gateway
          - tenant-manager
          - billing
      sj-proxy:
      sj-control-plane:
      sj-monitoring:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/admin/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    labels:
      platform: "sj-cloud"
      layer: "runtime-plane"
      service: "mesh-proxy"

networks:
  sj-proxy:
    external: true
  sj-control-plane:
    external: true
  sj-services:
    external: true
  sj-monitoring:
    external: true
