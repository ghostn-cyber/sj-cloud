version: '3.8'

services:
  # Control Plane Registry API
  registry-api:
    build:
      context: ../..
      dockerfile: platform/service-mesh/proxy/Dockerfile
    container_name: sj-registry-api
    command: node registry/cli/registry-api
    restart: unless-stopped
    volumes:
      - ../../config:/app/config
    environment:
      - PORT=8080
      - NODE_ENV=development
    networks:
      - sj-proxy
      - sj-services
      - sj-monitoring
    labels:
      platform: "sj-cloud"
      layer: "control-plane"
      service: "registry-api"

  # Runtime Mesh Proxy (DNS interceptor)
  mesh-proxy:
    build:
      context: ../..
      dockerfile: platform/service-mesh/proxy/Dockerfile
    container_name: sj-mesh-proxy
    command: node proxy/server.js
    restart: unless-stopped
    volumes:
      - ../../config:/app/config
    ports:
      - "9090:9090" # Admin / Prometheus scraping interface
    environment:
      - PORT=80
      - ADMIN_PORT=9090
      - NODE_ENV=development
    depends_on:
      - registry-api
    networks:
      sj-services:
        aliases:
          - auth
          - storage
          - notification
          - analytics
          - audit
          - search
          - queue
          - api-gateway
          - tenant-manager
          - billing
      sj-proxy:
      sj-monitoring:
    labels:
      platform: "sj-cloud"
      layer: "runtime-plane"
      service: "mesh-proxy"

  # Mock Platform Services (for testing & verification)
  mock-auth:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-auth
    environment:
      - SERVICE_ID=auth
      - PORT=80
    networks:
      - sj-services

  mock-storage:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-storage
    environment:
      - SERVICE_ID=storage
      - PORT=80
    networks:
      - sj-services

  mock-notification:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-notification
    environment:
      - SERVICE_ID=notification
      - PORT=80
    networks:
      - sj-services

  mock-analytics:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-analytics
    environment:
      - SERVICE_ID=analytics
      - PORT=80
    networks:
      - sj-services

  mock-audit:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-audit
    environment:
      - SERVICE_ID=audit
      - PORT=80
    networks:
      - sj-services

  mock-search:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-search
    environment:
      - SERVICE_ID=search
      - PORT=80
    networks:
      - sj-services

  mock-queue:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-queue
    environment:
      - SERVICE_ID=queue
      - PORT=80
    networks:
      - sj-services

  mock-api-gateway:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-api-gateway
    environment:
      - SERVICE_ID=api-gateway
      - PORT=80
    networks:
      - sj-services
      - sj-proxy

  mock-tenant-manager:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-tenant-manager
    environment:
      - SERVICE_ID=tenant-manager
      - PORT=80
    networks:
      - sj-services

  mock-billing:
    build:
      context: ../../platform/testing/mock-service
    container_name: sj-billing
    environment:
      - SERVICE_ID=billing
      - PORT=80
    networks:
      - sj-services

networks:
  sj-proxy:
    external: true
  sj-services:
    external: true
  sj-monitoring:
    external: true
