services:
  loki:
    image: grafana/loki:3.1.0
    container_name: sj-loki
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sj-loki-data:/loki
      - ../logging/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sj-monitoring
      - sj-observability
    deploy:
      resources:
        limits:
          pids: 100
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  promtail:
    image: grafana/promtail:3.1.0
    container_name: sj-promtail
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:984"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../logging/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - sj-monitoring
      - sj-observability
    deploy:
      resources:
        limits:
          pids: 50
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9080/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  otel-collector:
    build:
      context: ../otel-collector
    container_name: sj-otel-collector
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otel-collector-config.yaml:ro
    command: --config=/etc/otel-collector-config.yaml
    networks:
      - sj-monitoring
      - sj-services
      - sj-proxy
      - sj-observability
    deploy:
      resources:
        limits:
          pids: 100
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: sj-jaeger
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - sj-monitoring
      - sj-proxy
      - sj-observability
    deploy:
      resources:
        limits:
          pids: 100
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  sj-proxy:
    external: true
  sj-services:
    external: true
  sj-monitoring:
    external: true
  sj-observability:
    external: true

volumes:
  sj-loki-data:
    name: sj-loki-data
