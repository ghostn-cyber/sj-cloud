global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "sj-alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["sj-traefik:8080"] # Scrape metrics from Traefik api endpoint

  - job_name: "node-exporter"
    static_configs:
      - targets: ["sj-node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["sj-cadvisor:8080"]

  - job_name: "mesh-proxy"
    static_configs:
      - targets: ["sj-mesh-proxy:9090"]

  - job_name: "registry-api"
    static_configs:
      - targets: ["sj-registry-api:8080"]

  - job_name: "loki"
    static_configs:
      - targets: ["sj-loki:3100"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["sj-otel-collector:8888"]
