# Redis Configuration File

# Network
bind 0.0.0.0
protected-mode yes
port 6379

# General
daemonize no
loglevel notice

# Memory Management
maxmemory 128mb
maxmemory-policy allkeys-lru

# Persistence (RDB + AOF)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
dir /data
