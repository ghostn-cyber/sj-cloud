pipeline_id: default-golang-pipeline
tenant_id: default-tenant
application_id: default-app
trigger:
  type: push
  branch: main
stages:
  - name: Checkout
    steps:
      - name: Git Clone
        run: git clone
  - name: Install
    steps:
      - name: Go Get Dependencies
        run: go mod download
  - name: Restore Cache
    steps:
      - name: Restore Cache
        run: restore-cache
  - name: Build
    steps:
      - name: Go Build
        run: build-engine
  - name: Test
    steps:
      - name: Run Tests
        run: go test ./...
  - name: Security Scan
    steps:
      - name: Govulncheck
        run: govulncheck ./...
  - name: Package
    steps:
      - name: Package Artifact
        run: zip build
  - name: Publish Artifact
    steps:
      - name: Publish Artifact
        run: publish-artifact
  - name: Deploy
    steps:
      - name: Deploy Application
        run: deploy-engine
  - name: Verify
    steps:
      - name: Verify Health
        run: verify
