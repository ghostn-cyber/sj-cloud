pipeline_id: default-fastapi-pipeline
tenant_id: default-tenant
application_id: default-app
trigger:
  type: push
  branch: main
stages:
  - name: Checkout
    steps:
      - name: Git Clone
        run: git clone
  - name: Install
    steps:
      - name: Pip Install
        run: pip install -r requirements.txt
  - name: Restore Cache
    steps:
      - name: Restore Cache
        run: restore-cache
  - name: Build
    steps:
      - name: Build Application
        run: build-engine
  - name: Test
    steps:
      - name: Run Tests
        run: pytest
  - name: Security Scan
    steps:
      - name: Safety Scan
        run: safety check
  - name: Package
    steps:
      - name: Package Artifact
        run: zip build
  - name: Publish Artifact
    steps:
      - name: Publish Artifact
        run: publish-artifact
  - name: Deploy
    steps:
      - name: Deploy Application
        run: deploy-engine
  - name: Verify
    steps:
      - name: Verify Health
        run: verify
